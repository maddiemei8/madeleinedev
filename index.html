<!DOCTYPE html>

<head>
    <title>Maddie's Super Cool Website</title>
    <style>
        .myHeader {

            padding: 16px;

        .menu {
            list-style-type: none;

            padding: 0;
            overflow: hidden;
        }

        .menuItem {
            float: left;

        .menuItem a {

            color: red;
        }

</head>
<body>
    <div class="myHeader" style="float:left;">
        <h1 id="Hi" style="float: left; text-align: center;">Hi!</h1>
        <ul class="menu">
            <li class="menuItem"><a href="#Hi">About</a></li>

        </ul>

</html>
